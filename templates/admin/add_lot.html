{% extends 'admin/base_admin.html' %}
{% block title %}Add Parking Lot{% endblock %}
{% block content %}

<div class="form-container">
<h2>New Parking Lot</h2>
<form method="POST" class="form">
    <label>Name:</label>
    <input type="text" name="name" required>

    <label>Address:</label>
    <input type="text" name="address">

    <label>Pincode:</label>
    <input type="text" name="pin_code">

    <label>Price (₹/hr):</label>
    <input type="number" name="price" step="0.01" required>

    <label>Max Spots:</label>
    <input type="number" name="max_spots" required>

  
    <div class="button-group">
    <a href="{{ url_for('admin.home') }}">
        <button type="button" class="btn cancel">Cancel</button>
    </a>
    
    <button type="submit" class="btn">Add Lot</button>
</div>

</form>
</div>
{% endblock %}
