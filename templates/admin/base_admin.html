<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <meta charset="UTF-8">
  <title>{% block title %}Dashboard{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .nav-link.text-secondary:hover {
      color: #0d6efd !important;
    }
    .nav-link.text-danger:hover {
      color: #a60000 !important;
    }

    .navbar-nav .nav-item {
      padding: 0 0.75rem;
      position: relative;
    }

    /* Short separator between nav items */
    .navbar-nav .nav-item.border-right-short::after {
      content: "";
      position: absolute;
      right: 0;
      top: 15%;           /* Push separator slightly down */
      height: 70%;        /* Shorter height */
      width: 1px;
      background-color: #dee2e6;
    }

    /* Prevent last item from showing separator */
    .navbar-nav .nav-item:last-child::after {
      display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-3 py-2">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">ParkIN</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item border-right-short">
            <a class="nav-link text-secondary" href="{{ url_for('admin.home') }}">
              <i class="bi bi-house-door"></i> Home
            </a>
          </li>
          <li class="nav-item border-right-short">
            <a class="nav-link text-secondary" href="{{ url_for('admin.users') }}">
              <i class="bi bi-people"></i> Users
            </a>
          </li>
          <li class="nav-item border-right-short">
            <a class="nav-link text-secondary" href="{{ url_for('admin.search') }}">
              <i class="bi bi-search"></i> Search
            </a>
          </li>
          <li class="nav-item border-right-short">
            <a class="nav-link text-secondary" href="{{ url_for('admin.summary') }}">
              <i class="bi bi-graph-up"></i> Summary
            </a>
          </li>
          <li class="nav-item border-right-short">
            <a class="nav-link text-secondary" href="{{ url_for('admin.edit_profile') }}">
              <i class="bi bi-person-gear"></i> Edit Profile
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-danger fw-semibold" href="{{ url_for('auth.logout') }}">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
