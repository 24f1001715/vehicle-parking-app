<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <title>{% block title %}Admin Dashboard{% endblock %}</title>

    <link
      rel="icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    <script>
      (function() {
        const theme = localStorage.getItem("parkin_theme") || "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-3 py-2 d-none d-lg-flex border-bottom"
    >
      <div class="container align-items-center">
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="{{ url_for('admin.home') }}">
          <i class="bi bi-p-square-fill fs-4"></i> ParkIN Admin
        </a>

        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav align-items-center gap-1">
            <li class="nav-item border-right-short">
              <a
                class="nav-link text-secondary"
                href="{{ url_for('admin.home') }}"
              >
                <i class="bi bi-house-door me-1"></i> Home
              </a>
            </li>
            <li class="nav-item border-right-short">
              <a
                class="nav-link text-secondary"
                href="{{ url_for('admin.users') }}"
              >
                <i class="bi bi-people me-1"></i> Users
              </a>
            </li>
            <li class="nav-item border-right-short">
              <a
                class="nav-link text-secondary"
                href="{{ url_for('admin.search') }}"
              >
                <i class="bi bi-search me-1"></i> Search
              </a>
            </li>
            <li class="nav-item border-right-short">
              <a
                class="nav-link text-secondary"
                href="{{ url_for('admin.summary') }}"
              >
                <i class="bi bi-graph-up me-1"></i> Summary
              </a>
            </li>
            <li class="nav-item border-right-short">
              <a
                class="nav-link text-secondary"
                href="{{ url_for('admin.edit_profile') }}"
              >
                <i class="bi bi-person-gear me-1"></i> Profile
              </a>
            </li>
            <li class="nav-item border-right-short">
              <a
                class="nav-link text-danger fw-semibold"
                href="{{ url_for('auth.logout') }}"
              >
                <i class="bi bi-box-arrow-right me-1"></i> Logout
              </a>
            </li>
            <li class="nav-item ms-2">
              <button class="dark-mode-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
                <i class="bi bi-moon-stars dark-mode-icon"></i>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <nav
      class="navbar bg-white shadow-sm d-flex d-lg-none align-items-center px-3 py-2 position-fixed top-0 start-0 w-100 z-3 border-bottom top-bar"
    >
      <a class="navbar-brand fw-bold text-primary text-decoration-none d-flex align-items-center gap-1" href="{{ url_for('admin.home') }}">
        <i class="bi bi-p-square-fill fs-5"></i> ParkIN Admin
      </a>
      <div class="ms-auto d-flex align-items-center">
        <button class="dark-mode-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
          <i class="bi bi-moon-stars dark-mode-icon"></i>
        </button>
      </div>
    </nav>

    <nav
      class="navbar navbar-light bg-white shadow-lg border-top fixed-bottom d-flex d-lg-none justify-content-around bottom-nav"
    >
      <a
        class="nav-link text-center text-secondary"
        href="{{ url_for('admin.home') }}"
      >
        <i class="bi bi-house-door"></i><br /><small>Home</small>
      </a>
      <a
        class="nav-link text-center text-secondary"
        href="{{ url_for('admin.users') }}"
      >
        <i class="bi bi-people"></i><br /><small>Users</small>
      </a>
      <a
        class="nav-link text-center text-secondary"
        href="{{ url_for('admin.search') }}"
      >
        <i class="bi bi-search"></i><br /><small>Search</small>
      </a>
      <a
        class="nav-link text-center text-secondary"
        href="{{ url_for('admin.summary') }}"
      >
        <i class="bi bi-graph-up"></i><br /><small>Summary</small>
      </a>
      <a
        class="nav-link text-center text-danger fw-semibold"
        href="{{ url_for('auth.logout') }}"
      >
        <i class="bi bi-box-arrow-right"></i><br /><small>Logout</small>
      </a>
    </nav>

    <main class="container py-4 site-content">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='scripts/darkmode.js') }}"></script>

  </body>
</html>
