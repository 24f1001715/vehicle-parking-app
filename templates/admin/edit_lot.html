{% extends 'admin/base_admin.html' %}
{% block title %}Edit Parking Lot{% endblock %}
{% block content %}

<div class="form-container">
  <h2>Edit Parking Lot</h2>

  <form method="POST" class="form">
    <label>Name:</label>
    <input type="text" name="name" value="{{ lot.prime_location_name }}" required>

    <label>Address:</label>
    <input type="text" name="address" value="{{ lot.address }}">

    <label>Pincode:</label>
    <input type="text" name="pin_code" value="{{ lot.pin_code }}">

    <label>Price (&#8377;/hr):</label>
    <input type="number" name="price" step="0.01" value="{{ lot.price }}" required>

    <label>Max Spots:</label>
    <input type="number" name="max_spots" value="{{ lot.max_spots }}" required>

    <div class="button-group">
      <a href="{{ url_for('admin.home') }}">
        <button type="button" class="btn cancel">Cancel</button>
      </a>

      <button type="submit" class="btn">Update</button>
    </div>
  </form>
  {% if error %}
<div style="color: red; margin: 10px;">{{ error }}</div>
{% endif %}
</div>

{% endblock %}
