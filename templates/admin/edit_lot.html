{% extends 'admin/base_admin.html' %}
{% block title %}Edit Parking Lot{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card h-100 shadow-sm position-relative border rounded-3">
        <div class="card-body p-4">
          <h4 class="card-title mb-4 text-center">Edit Parking Lot</h4>

          <form method="POST">

            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" name="name" value="{{ lot.prime_location_name }}" required class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" name="address" value="{{ lot.address }}" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Pincode</label>
              <input type="text" name="pin_code" value="{{ lot.pin_code }}" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Price (₹/hr)</label>
              <input type="number" step="0.01" name="price" value="{{ lot.price }}" required class="form-control">
            </div>

            <div class="mb-4">
              <label class="form-label">Max Spots</label>
              <input type="number" name="max_spots" value="{{ lot.max_spots }}" required class="form-control">
            </div>

            <div class="d-flex justify-content-center gap-3 mt-3">
              <a href="{{ url_for('admin.home') }}" class="btn btn-outline-danger px-4 w-50">Cancel</a>
              <button type="submit" class="btn btn-primary px-4 w-50">Update</button>
            </div>

            {% if error %}
            <div class="text-center text-danger mt-3">{{ error }}</div>
            {% endif %}
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
