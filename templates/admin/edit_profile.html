{% extends 'admin/base_admin.html' %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card h-100 shadow-sm position-relative border rounded-3">
        <div class="card-body p-4">
          <h4 class="card-title mb-4 text-center">Edit Profile</h4>

          <form method="POST" class="row g-3">
            <div class="col-12">
              <label for="fullname" class="form-label">Full Name</label>
              <input type="text" id="fullname" name="fullname" class="form-control" value="{{ admin.fullname }}" required>
            </div>

            <div class="col-12">
              <label for="address" class="form-label">Address</label>
              <input type="text" id="address" name="address" class="form-control" value="{{ admin.address }}">
            </div>

            <div class="col-12">
              <label for="pincode" class="form-label">Pincode</label>
              <input type="text" id="pincode" name="pincode" class="form-control" value="{{ admin.pincode }}">
            </div>

            <div class="col-12 d-flex justify-content-center gap-3 mt-4">
              <a href="{{ url_for('admin.home') }}" class="btn btn-outline-danger px-4 w-50">Cancel</a>
              <button type="submit" class="btn btn-primary px-4 w-50">Update</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
