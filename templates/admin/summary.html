{% extends 'admin/base_admin.html' %}
{% block title %}Admin Summary{% endblock %}

{% block content %}
<div class="container mt-4">

  <h2 class="mb-4">Parking Management Summary</h2>

  <!-- Row 1: Doughnut + Booking Trend -->
  <div class="row g-4 mb-3">
    <!-- Doughnut Chart -->
    <div class="col-12 col-md-6">
      <div class="card h-100 shadow-sm position-relative">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">Overall Spot Status</h5>
          <canvas id="pieChart" height="120"></canvas>
        </div>
      </div>
    </div>

    <!-- Booking Trends Line Chart -->
    <div class="col-12 col-md-6">
      <div class="card h-100 shadow-sm position-relative">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">Booking Trends (Last 7 Days)</h5>
          <canvas id="bookingTrendChart" height="100"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Row 2: Revenue Charts -->
  <div class="row g-4 mb-3">
    <!-- Revenue by Day -->
    <div class="col-12 col-md-6">
      <div class="card h-100 shadow-sm position-relative">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">Revenue Analysis (Last 7 Days)</h5>
          <canvas id="revenueChart" height="100"></canvas>
        </div>
      </div>
    </div>

    <!-- Revenue by Lot -->
    <div class="col-12 col-md-6">
      <div class="card h-100 shadow-sm position-relative">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">Total Revenue by Parking Lot</h5>
          <canvas id="lotRevenueChart" height="100"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Row 3: Parking Spots Overview -->
  <div class="row g-4 mb-5">
    <div class="col-12">
      <div class="card h-100 shadow-sm position-relative">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">Parking Spots Overview</h5>
          <canvas id="barChart" height="120"></canvas>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const lotNames = {{ lot_names | tojson }};
  const totalSpots = {{ total_spots | tojson }};
  const reservedSpots = {{ reserved_spots | tojson }};
  const availableSpots = {{ available_spots | tojson }};
  const trendLabels = {{ trend_labels | tojson }};
  const bookingCounts = {{ booking_counts | tojson }};
  const revenues = {{ revenues | tojson }};
  const revenuePerLot = {{ revenue_per_lot | tojson }};

  // Parking Spots Overview (Bar Chart)
  new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: lotNames,
      datasets: [
        { label: 'Total Spots', data: totalSpots, backgroundColor: 'rgba(54, 162, 235, 0.6)' },
        { label: 'Available Spots', data: availableSpots, backgroundColor: 'rgba(75, 192, 192, 0.6)' },
        { label: 'Reserved Spots', data: reservedSpots, backgroundColor: 'rgba(255, 99, 132, 0.6)' }
      ]
    },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true } }
    }
  });

  // Doughnut Chart
  new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: ['Reserved Spots', 'Available Spots'],
      datasets: [{
        data: [
          reservedSpots.reduce((a, b) => a + b, 0),
          availableSpots.reduce((a, b) => a + b, 0)
        ],
        backgroundColor: ['rgba(255, 99, 132, 0.6)', 'rgba(75, 192, 192, 0.6)']
      }]
    },
    options: { responsive: true }
  });

  // Booking Trends
  new Chart(document.getElementById('bookingTrendChart'), {
    type: 'line',
    data: {
      labels: trendLabels,
      datasets: [{
        label: 'Bookings',
        data: bookingCounts,
        borderColor: 'rgba(54, 162, 235, 1)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.3,
        fill: true,
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true, stepSize: 1 } }
    }
  });

  // Revenue per Day
  new Chart(document.getElementById('revenueChart'), {
    type: 'bar',
    data: {
      labels: trendLabels,
      datasets: [{
        label: 'Revenue (₹)',
        data: revenues,
        backgroundColor: 'rgba(255, 206, 86, 0.6)',
        borderColor: 'rgba(255, 206, 86, 1)',
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true } }
    }
  });

  // Revenue by Lot
  new Chart(document.getElementById('lotRevenueChart'), {
    type: 'bar',
    data: {
      labels: lotNames,
      datasets: [{
        label: 'Total Revenue (₹)',
        data: revenuePerLot,
        backgroundColor: 'rgba(153, 102, 255, 0.6)',
        borderColor: 'rgba(153, 102, 255, 1)',
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true } }
    }
  });
</script>
{% endblock %}
