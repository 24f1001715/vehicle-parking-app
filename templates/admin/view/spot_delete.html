{% extends 'admin/base_admin.html' %}
{% block title %}Delete Spot{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm position-relative border rounded-3">
      <div class="card-body px-4 py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="card-title mb-0">Delete Parking Spot</h4>
          <a href="{{ url_for('admin.view_lot', lot_id=spot.lot_id) }}" class="btn btn-sm btn-outline-secondary d-inline d-md-none" title="Cancel">
            <i class="bi bi-x-lg"></i>
          </a>
        </div>

        <form method="POST" onsubmit="return confirm('Are you sure you want to delete this parking spot?')">
          
          <div class="mb-3">
            <label class="form-label fw-semibold">Spot Number:</label>
            <div class="form-control bg-light">{{ spot.spot_number }}</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Status:</label>
            <div class="form-control bg-light">
              {{ 'Available' if spot.status == 'A' else 'Reserved' }}
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Parking Lot:</label>
            <div class="form-control bg-light">{{ spot.lot.prime_location_name }}</div>
          </div>

          <div class="d-flex justify-content-center gap-3 mt-4">
            <button type="submit" class="btn btn-danger px-4 w-50">Delete</button>
            <a href="{{ url_for('admin.view_lot', lot_id=spot.lot_id) }}" class="btn btn-outline-secondary px-4 w-50">Cancel</a>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
