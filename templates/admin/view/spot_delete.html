{% extends 'admin/base_admin.html' %}
{% block title %}Delete Spot{% endblock %}

{% block content %}
<h2>Spot Details</h2>
<p><strong>Spot Number:</strong> {{ spot.spot_number }}</p>
<p><strong>Status:</strong> {{ 'Available' if spot.status == 'A' else 'Reserved' }}</p>
<p><strong>Lot:</strong> {{ spot.lot.prime_location_name }}</p>

<form method="POST" onsubmit="return confirm('Are you sure you want to delete this parking spot?')">
    <button type="submit" class="btn cancel">Delete Spot</button>
    <a href="{{ url_for('admin.view_lot', lot_id=spot.lot_id) }}"><button type="button" class="btn">Cancel</button></a>
</form>
{% endblock %}
