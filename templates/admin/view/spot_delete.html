{% extends 'admin/base_admin.html' %}
{% block title %}Delete Spot{% endblock %}

{% block content %}
<h2 style="text-align: center;">Delete Parking Spot</h2>

<div class="form-container">
  <form method="POST" onsubmit="return confirm('Are you sure you want to delete this parking spot?')">
    
    <label>Spot Number:</label>
    <div class="readonly-field">{{ spot.spot_number }}</div>

    <label>Status:</label>
    <div class="readonly-field">
      {{ 'Available' if spot.status == 'A' else 'Reserved' }}
    </div>

    <label>Lot:</label>
    <div class="readonly-field">{{ spot.lot.prime_location_name }}</div>

    <div class="button-group" style="margin-top: 25px;">
      <button type="submit" class="btn cancel">Delete</button>
      <a href="{{ url_for('admin.view_lot', lot_id=spot.lot_id) }}">
        <button type="button" class="btn">Cancel</button>
      </a>
    </div>

  </form>
</div>
{% endblock %}
