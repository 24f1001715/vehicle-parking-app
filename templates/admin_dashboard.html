<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>
    <h1>Welcome, Admin</h1>
    <h2>Registered Users</h2>

    {% if users %}
        <table border="1">
            <tr>
                <th>Email</th>
                <th>Full Name</th>
                <th>Address</th>
                <th>Pincode</th>
            </tr>
            {% for user in users %}
            <tr>
                <td>{{ user.email_id }}</td>
                <td>{{ user.fullname }}</td>
                <td>{{ user.address }}</td>
                <td>{{ user.pincode }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No users registered yet.</p>
    {% endif %}
    <a href="{{ url_for('auth.logout') }}">Logout</a>

</body>
</html>
