<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  <script>
    (function() {
      const theme = localStorage.getItem("parkin_theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>

  <nav class="navbar bg-white shadow-sm d-flex align-items-center px-3 py-2 position-fixed top-0 start-0 w-100 z-3 border-bottom top-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2 text-decoration-none" href="{{ url_for('auth.login') }}">
        <i class="bi bi-p-square-fill fs-4"></i> ParkIN
      </a>
      <div class="ms-auto d-flex align-items-center">
        <button class="dark-mode-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
          <i class="bi bi-moon-stars dark-mode-icon"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="container login-wrapper d-flex flex-column justify-content-center align-items-center" style="min-height: calc(100vh - 60px); padding-top: 80px; padding-bottom: 40px;">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="login-card card shadow-sm border">
          <div class="card-body px-4 py-4">
            <div class="text-center mb-4">
              <i class="bi bi-p-square-fill text-primary" style="font-size: 2.5rem;"></i>
              <h3 class="fw-bold mt-2 mb-1">Welcome back</h3>
              <p class="text-muted small mb-0">Sign in to your ParkIN account</p>
            </div>

            {% if error %}
              <div class="alert alert-danger text-center py-2 mb-3 small" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST">
              <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" name="email" class="form-control border-start-0 ps-0" placeholder="name@example.com" required autocomplete="email">
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required autocomplete="current-password">
                </div>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2 fw-semibold">Sign In</button>
              </div>

              <p class="text-center text-muted small mb-0">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}" class="fw-semibold text-decoration-none">Sign up</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='scripts/darkmode.js') }}"></script>
</body>
</html>
