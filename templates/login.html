<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  <script>
    (function() {
      const theme = localStorage.getItem("parkin_theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>

  <nav class="navbar bg-white shadow-sm d-flex align-items-center px-3 py-2 position-fixed top-0 start-0 w-100 z-3 border-bottom top-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2 text-decoration-none" href="{{ url_for('auth.login') }}">
        <i class="bi bi-p-square-fill fs-4"></i> ParkIN
      </a>
      <div class="ms-auto d-flex align-items-center">
        <button class="dark-mode-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
          <i class="bi bi-moon-stars dark-mode-icon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container login-wrapper">
    <div class="login-card card shadow-sm border">
      <div class="card-body px-4 py-4">
        <h4 class="card-title mb-3 text-center">Login</h4>

        {% if error %}
          <div class="alert alert-danger text-center py-2">{{ error }}</div>
        {% endif %}

        <form method="POST">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>

          <p class="text-center mb-0">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Sign up</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='scripts/darkmode.js') }}"></script>
</body>
</html>
