<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Dark Mode Script -->
  <script>
    (function () {
      const applyDarkMode = () => {
        document.documentElement.style.filter = "invert(1) hue-rotate(180deg)";
        document.body.style.backgroundColor = "#fff";
        document.querySelectorAll("img, video").forEach(el => {
          el.style.filter = "invert(1) hue-rotate(180deg)";
        });
      };

      const removeDarkMode = () => {
        document.documentElement.style.filter = "";
        document.body.style.backgroundColor = "";
        document.querySelectorAll("img, video").forEach(el => {
          el.style.filter = "";
        });
      };

      const toggleDark = () => {
        const isDark = document.documentElement.style.filter.includes("invert");
        if (isDark) {
          removeDarkMode();
          localStorage.setItem("darkMode", "off");
        } else {
          applyDarkMode();
          localStorage.setItem("darkMode", "on");
        }

        const toggles = document.querySelectorAll(".form-check-input");
        toggles.forEach(t => t.checked = !isDark);
      };

      document.addEventListener("DOMContentLoaded", () => {
        const toggles = document.querySelectorAll(".form-check-input");
        toggles.forEach(t => t.addEventListener("change", toggleDark));

        if (localStorage.getItem("darkMode") === "on") {
          applyDarkMode();
          toggles.forEach(t => t.checked = true);
        }

        const observer = new MutationObserver(() => {
          if (document.documentElement.style.filter.includes("invert")) {
            document.querySelectorAll("img, video").forEach(el => {
              el.style.filter = "invert(1) hue-rotate(180deg)";
            });
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>

  <style>
    .top-bar {
      min-height: 48px;
    }

    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    @media (max-width: 575.98px) {
      .login-wrapper {
        padding-bottom: 5rem;
        align-items: center-start;
      }
    }

    .form-switch .form-check-input {
      width: 2.5em;
      height: 1.3em;
    }
  </style>
</head>
<body class="bg-light">

<!-- Top Navbar -->
<nav class="navbar bg-white shadow-sm d-flex align-items-center px-3 py-1 position-fixed top-0 start-0 w-100 z-3 top-bar">
  <span class="navbar-brand fw-bold text-primary position-absolute top-50 start-50 translate-middle">ParkIN</span>
  <div class="ms-auto">
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="darkToggleMobile">
    </div>
  </div>
</nav>

<!-- Register Form -->
<div class="container login-wrapper pt-5">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm border">
        <div class="card-body px-4 py-4">
          <h4 class="card-title mb-3 text-center">Register</h4>

          {% if error %}
            <p class="text-danger text-center">{{ error }}</p>
          {% endif %}

          <form method="POST">
            <div class="mb-3">
              <label for="fullname" class="form-label">Full Name</label>
              <input type="text" id="fullname" name="fullname" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <input type="text" id="address" name="address" class="form-control">
            </div>

            <div class="mb-4">
              <label for="pincode" class="form-label">Pincode</label>
              <input type="text" id="pincode" name="pincode" class="form-control">
            </div>

            <div class="d-flex justify-content-center">
              <button type="submit" class="btn btn-primary w-100">Register</button>
            </div>

            <p class="mt-3 text-center">
              Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
