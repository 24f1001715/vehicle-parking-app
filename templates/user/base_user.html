<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">

  <meta charset="UTF-8">
  <title>{% block title %}User Dashboard{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .nav-link.text-secondary:hover {
      color: #0d6efd !important;
    }
    .nav-link.text-danger:hover {
      color: #a60000 !important;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-3 py-2">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">ParkIN</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-2">
          <li class="nav-item">
            <a class="nav-link text-secondary" href="{{ url_for('user.home') }}">
              <i class="bi bi-house-door"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-secondary" href="{{ url_for('user.book') }}">
              <i class="bi bi-calendar-check"></i> Book
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-secondary" href="{{ url_for('user.summary') }}">
              <i class="bi bi-clock-history"></i> Summary
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-secondary" href="{{ url_for('user.edit_profile') }}">
              <i class="bi bi-person-gear"></i> Edit Profile
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-danger fw-semibold" href="{{ url_for('auth.logout') }}">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
