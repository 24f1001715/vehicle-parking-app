<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>{% block title %}User Dashboard{% endblock %}</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">

  

</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-3 py-2 d-none d-lg-flex">
    <div class="container-fluid align-items-center">
      <a class="navbar-brand fw-bold text-primary me-3" href="#">ParkIN</a>
      <div class="form-check form-switch me-auto">
        <input class="form-check-input" type="checkbox" id="darkToggleDesktop">
      </div>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item border-right-short">
            <a class="nav-link text-secondary" href="{{ url_for('user.home') }}">
              <i class="bi bi-house-door"></i> Home
            </a>
          </li>
          <li class="nav-item border-right-short">
            <a class="nav-link text-secondary" href="{{ url_for('user.book') }}">
              <i class="bi bi-calendar-check"></i> Book
            </a>
          </li>
          <li class="nav-item border-right-short">
            <a class="nav-link text-secondary" href="{{ url_for('user.summary') }}">
              <i class="bi bi-graph-up"></i> Summary
            </a>
          </li>
          <li class="nav-item border-right-short">
            <a class="nav-link text-secondary" href="{{ url_for('user.edit_profile') }}">
              <i class="bi bi-person-gear"></i> Edit Profile
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-danger fw-semibold" href="{{ url_for('auth.logout') }}">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

<nav class="navbar bg-white shadow-sm d-flex d-lg-none align-items-center px-3 py-1 position-fixed top-0 start-0 w-100 z-3" style="min-height: 48px;">
  <span class="navbar-brand fw-bold text-primary position-absolute top-50 start-50 translate-middle">ParkIN</span>
  
  <div class="ms-auto">
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="darkToggleMobile">
    </div>
  </div>
</nav>

  <nav class="navbar navbar-light bg-white shadow-lg border-top fixed-bottom d-flex d-lg-none justify-content-around bottom-nav">
    <a class="nav-link text-center text-secondary" href="{{ url_for('user.home') }}">
      <i class="bi bi-house-door"></i><br><small>Home</small>
    </a>
    <a class="nav-link text-center text-secondary" href="{{ url_for('user.book') }}">
      <i class="bi bi-calendar-check"></i><br><small>Book</small>
    </a>
    <a class="nav-link text-center text-secondary" href="{{ url_for('user.summary') }}">
      <i class="bi bi-graph-up"></i><br><small>Summary</small>
    </a>
    <a class="nav-link text-center text-secondary" href="{{ url_for('user.edit_profile') }}">
      <i class="bi bi-person-gear"></i><br><small>Profile</small>
    </a>
    <a class="nav-link text-center text-danger fw-semibold" href="{{ url_for('auth.logout') }}">
      <i class="bi bi-box-arrow-right"></i><br><small>Logout</small>
    </a>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='scripts/darkmode.js') }}"></script>

</body>
</html>
