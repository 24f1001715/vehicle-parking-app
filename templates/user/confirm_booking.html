{% extends 'user/base_user.html' %}
{% block title %}Confirm Booking{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card h-100 shadow-sm position-relative">
        <div class="card-body px-4 py-4">

          <h4 class="card-title mb-4 text-center">Confirm Booking</h4>
          <form method="POST">

            <div class="mb-3">
              <label class="form-label">Lot ID:</label>
              <input type="text" class="form-control" value="{{ lot.id }}" readonly>
            </div>

            <div class="mb-3">
              <label class="form-label">Spot Number:</label>
              <input type="text" class="form-control" value="Spot #{{ spot.spot_number if spot else 'N/A' }}" readonly>
            </div>

            <div class="mb-3">
              <label class="form-label">Your Email:</label>
              <input type="text" class="form-control" value="{{ user_email }}" readonly>
            </div>

            <div class="mb-4">
              <label class="form-label">Vehicle Number:</label>
              <input type="text" name="vehicle_number" class="form-control" placeholder="Enter your vehicle number" required>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-3">
              <a href="{{ url_for('user.book') }}" class="btn btn-outline-danger px-4 w-50">Cancel</a>
              <button type="submit" class="btn btn-primary px-4 w-50">Book</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
