{% extends 'user/base_user.html' %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm position-relative">
      <div class="card-body px-4 py-4">
        <h4 class="card-title mb-4 text-center">Edit Profile</h4>
        <form method="POST">
          
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ user.email_id }}" required>
          </div>

          <div class="mb-3">
            <label for="fullname" class="form-label">Full Name</label>
            <input type="text" id="fullname" name="fullname" class="form-control" value="{{ user.fullname }}" required>
          </div>

          <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" id="address" name="address" class="form-control" value="{{ user.address }}">
          </div>

          <div class="mb-3">
            <label for="pincode" class="form-label">Pincode</label>
            <input type="text" id="pincode" name="pincode" class="form-control" value="{{ user.pincode }}">
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">New Password (optional)</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
          </div>

          <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="{{ url_for('user.home') }}" class="btn btn-outline-danger px-4 w-50">Cancel</a>
            <button type="submit" class="btn btn-primary px-4 w-50">Save Changes</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
