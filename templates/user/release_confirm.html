{% extends 'user/base_user.html' %}
{% block title %}Confirm Release{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card h-100 shadow-sm position-relative">
        <div class="card-body px-4 py-4">
          <h4 class="card-title mb-4 text-center">Confirm Release</h4>

          <form method="POST" action="{{ url_for('user.release_spot_confirm', reservation_id=reservation.id) }}">
            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label">Lot:</label>
                <input type="text" class="form-control bg-light" value="{{ reservation.lot.prime_location_name if reservation.lot else 'Parking Lot' }}" readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label">Spot Number:</label>
                <input type="text" class="form-control bg-light" value="Spot #{{ reservation.spot.spot_number if reservation.spot else 'N/A' }}" readonly>
              </div>

              <div class="col-12">
                <label class="form-label">Vehicle Number:</label>
                <input type="text" class="form-control bg-light" value="{{ reservation.vehicle_number }}" readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label">Parked At:</label>
                <input type="text" class="form-control bg-light" value="{{ start }}" readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label">Current Time:</label>
                <input type="text" class="form-control bg-light" value="{{ now }}" readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label">Duration (hrs):</label>
                <input type="text" class="form-control bg-light" value="{{ duration }}" readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label">Cost per Hour (₹):</label>
                <input type="text" class="form-control bg-light" value="{{ reservation.cost_per_hour }}" readonly>
              </div>

              <div class="col-12">
                <label class="form-label">Estimated Cost (₹):</label>
                <input type="text" class="form-control bg-light" value="{{ estimated_cost }}" readonly>
              </div>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
              <a href="{{ url_for('user.home') }}" class="btn btn-outline-secondary px-4 w-50">Cancel</a>
              <button type="submit" class="btn btn-danger px-4 w-50">Release</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
