{% extends 'user/base_user.html' %}
{% block title %}User Summary{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="text-center mb-4">
    <h2 class="fw-bold">Your Parking Summary</h2>
    <p class="text-muted">Track your parking behavior and spending insights</p>
  </div>

  <div class="row g-4">
    <!-- Booking Trend -->
    <div class="col-12 col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title text-center mb-3">Booking Trend (7 Days)</h5>
          <canvas id="bookingTrendChart" height="150"></canvas>
        </div>
      </div>
    </div>

    <!-- Cost Incurred -->
    <div class="col-12 col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title text-center mb-3">Cost Incurred (7 Days)</h5>
          <canvas id="costChart" height="150"></canvas>
        </div>
      </div>
    </div>

    <!-- Lot Usage -->
    <div class="col-12 col-lg-6">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title text-center mb-3">Frequent Parking Lots</h5>
          <canvas id="lotUsageChart" height="180"></canvas>
        </div>
      </div>
    </div>

    <!-- Reservation Status -->
    <div class="col-12 col-lg-6">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title text-center mb-3">Reservation Status</h5>
          <canvas id="statusChart" height="180"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const trendLabels = {{ trend_labels | tojson }};
  const bookingCounts = {{ booking_counts | tojson }};
  const costs = {{ costs | tojson }};
  const lotNames = {{ lot_names | tojson }};
  const lotUsage = {{ lot_usage | tojson }};
  const reserved = {{ reserved_count }};
  const completed = {{ completed_count }};

  new Chart(document.getElementById('bookingTrendChart'), {
    type: 'line',
    data: {
      labels: trendLabels,
      datasets: [{
        label: 'Bookings',
        data: bookingCounts,
        borderColor: 'rgba(54, 162, 235, 1)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.4,
        fill: true,
        pointRadius: 4,
        pointHoverRadius: 6
      }]
    },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true } }
    }
  });

  new Chart(document.getElementById('costChart'), {
    type: 'bar',
    data: {
      labels: trendLabels,
      datasets: [{
        label: 'Cost (₹)',
        data: costs,
        backgroundColor: 'rgba(255, 159, 64, 0.6)',
        borderRadius: 5
      }]
    },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true } }
    }
  });

  new Chart(document.getElementById('lotUsageChart'), {
    type: 'bar',
    data: {
      labels: lotNames,
      datasets: [{
        label: 'Times Used',
        data: lotUsage,
        backgroundColor: 'rgba(153, 102, 255, 0.6)',
        borderRadius: 5
      }]
    },
    options: {
      responsive: true,
      indexAxis: 'y',
      scales: { x: { beginAtZero: true } }
    }
  });

  new Chart(document.getElementById('statusChart'), {
    type: 'doughnut',
    data: {
      labels: ['Reserved', 'Completed'],
      datasets: [{
        data: [reserved, completed],
        backgroundColor: ['rgba(255, 99, 132, 0.6)', 'rgba(75, 192, 192, 0.6)']
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom' } }
    }
  });
</script>
{% endblock %}
